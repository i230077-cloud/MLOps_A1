name: Release & Container Registry Deployment

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build, Tag, and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Dependency Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest -v


      - name: Extract Semantic Version and Commit SHA
        id: meta
        run: |
          # Automatically strip leading 'v' from git tag (v1.0.0 -> 1.0.0) without hardcoding
          FULL_TAG="${{ github.ref_name }}"
          VERSION="${FULL_TAG#v}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          
          echo "Building release for version: ${VERSION} (Git Tag: ${FULL_TAG}, Commit: ${SHORT_SHA})"

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/${REPO_LOWER}/student-ml-api" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          # Build Docker image with OCI Metadata labels (Part 23)
          docker build \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${VERSION} \
            --label "org.opencontainers.image.title=student-ml-api" \
            --label "org.opencontainers.image.description=ML Inference API" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${BUILD_DATE}" \
            -t ${IMAGE_BASE}:${VERSION} \
            -t ${IMAGE_BASE}:latest \
            -t ${IMAGE_BASE}:${SHORT_SHA} \
            .

          # Push all version tags to registry
          docker push ${IMAGE_BASE}:${VERSION}
          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${SHORT_SHA}
